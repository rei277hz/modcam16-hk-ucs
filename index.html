<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101216" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"
    />
    <title>modCAM16-HK Cartesian Color Picker</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="visuals">
        <div class="plot-frame" aria-busy="true">
          <canvas
            id="gamut-slice"
            width="512"
            height="512"
            aria-label="Saturation X and Saturation Y gamut slice"
          ></canvas>
          <canvas
            id="gamut-indicators"
            width="512"
            height="512"
            aria-hidden="true"
          ></canvas>
          <span id="plot-status" class="plot-status" role="status"
            >Loading color engine…</span
          >
        </div>
        <div class="preview-panel">
          <div class="preview-column">
            <div id="preview-surround" class="preview-surround">
              <div
                id="preview"
                class="preview"
                aria-label="Chosen color preview"
              ></div>
            </div>
          </div>
          <div class="preview-details">
            <span id="rgb-label">Linear Rec.709 (sRGB)<sup>*</sup></span>
            <code id="linear-value">(0.000, 0.000, 0.000)</code>
            <span id="encoded-label">sRGB Encoded Rec.709 (sRGB)</span>
            <div class="encoded-value-row">
              <div class="hex-input">
                <span class="hex-prefix" aria-hidden="true">#</span>
                <input
                  id="encoded-value"
                  class="encoded-value"
                  type="text"
                  value="000000"
                  maxlength="6"
                  pattern="[0-9A-Fa-f]{6}"
                  spellcheck="false"
                  aria-label="Six sRGB Encoded Rec.709 hexadecimal digits"
                />
              </div>
              <button id="copy-value" class="action-button" type="button">
                Copy
              </button>
              <button id="set-value" class="action-button" type="button">
                Set
              </button>
            </div>
            <span
              id="colorchecker-name"
              class="colorchecker-name"
              hidden
            ></span>
          </div>
          <div class="background-control">
            <label for="background-brightness"
              >Background
              <span class="control-value" id="background-brightness-value"
                >0.150</span
              ></label
            >
            <div class="range-wrap">
              <span
                id="background-stick"
                class="stick-marker"
                hidden
                aria-hidden="true"
              ></span>
              <input
                id="background-brightness"
                type="range"
                min="0"
                max="1"
                step="0.001"
                value="0.3893"
                aria-label="Linear background brightness"
              />
            </div>
          </div>
        </div>
      </section>
      <section class="controls" aria-label="Color controls">
        <div class="control-row profile-row">
          <label for="profile">Mode</label>
          <select id="profile" aria-label="Source gamut and transform">
            <option value="3" selected>Rec.709 / No view transform</option>
            <option value="1">
              Rec.709 / ACES 2.0 - SDR 100 nits (Rec.709)
            </option>
            <option value="4">P3-D65 / ACES 2.0 - SDR 100 nits (P3 D65)</option>
            <option value="2">
              P3-D65 / ACES 2.0 - HDR 1000 nits (P3 D65)
            </option>
            <option value="0">
              Rec.2020 (P3-D65 limited) / ACES 2.0 - HDR 1000 nits (Rec.2020)
            </option>
          </select>
        </div>
        <div class="control-row">
          <label for="j-code">J<sub>HK</sub></label>
          <div class="slider-control">
            <div class="range-wrap">
              <span
                id="j-stick"
                class="stick-marker patch-stick"
                hidden
                aria-hidden="true"
              ></span>
              <input
                id="j-code"
                type="range"
                min="0"
                max="1"
                step="any"
                value="0.3"
                aria-label="Normalized J HK"
              />
            </div>
            <input
              id="j-number"
              class="number-input"
              type="number"
              min="0"
              max="1"
              step="any"
              value="0.3"
              inputmode="decimal"
              aria-label="Normalized J HK value"
            />
          </div>
        </div>
        <div class="control-row">
          <label for="saturation-x">Saturation X</label>
          <div class="slider-control">
            <div class="range-wrap">
              <span
                id="x-stick"
                class="stick-marker patch-stick"
                hidden
                aria-hidden="true"
              ></span>
              <input
                id="saturation-x"
                type="range"
                min="0"
                max="1"
                step="any"
                value="0.6"
                aria-label="Normalized saturation X"
              />
            </div>
            <input
              id="x-number"
              class="number-input"
              type="number"
              min="0"
              max="1"
              step="any"
              value="0.6"
              inputmode="decimal"
              aria-label="Normalized saturation X value"
            />
          </div>
        </div>
        <div class="control-row">
          <label for="saturation-y">Saturation Y</label>
          <div class="slider-control">
            <div class="range-wrap">
              <span
                id="y-stick"
                class="stick-marker patch-stick"
                hidden
                aria-hidden="true"
              ></span>
              <input
                id="saturation-y"
                type="range"
                min="0"
                max="1"
                step="any"
                value="0.58"
                aria-label="Normalized saturation Y"
              />
            </div>
            <input
              id="y-number"
              class="number-input"
              type="number"
              min="0"
              max="1"
              step="any"
              value="0.58"
              inputmode="decimal"
              aria-label="Normalized saturation Y value"
            />
          </div>
        </div>
      </section>
      <footer class="app-footer">
        * The raw J<sub>HK</sub>, Saturation X, and Saturation Y channels select
        this value.
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
